services:
  # Python FastAPI ML Service
  - type: web
    name: kosh-drishti-ml
    env: python
    buildCommand: pip install -r ml_service/requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    rootDir: ml_service
    envVars:
      - key: GROQ_API_KEY
        sync: false

  # Node.js Express Backend API
  - type: web
    name: kosh-drishti-backend
    env: node
    buildCommand: npm install
    startCommand: node src/server.js
    rootDir: backend
    envVars:
      - key: PORT
        value: 10000
      - key: ML_SERVICE_URL
        fromService:
          type: web
          name: kosh-drishti-ml
          property: host
      - key: FRONTEND_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
